services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-cvadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-local}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://cvadmin:change-me-local@mongodb:27017/DTP?authSource=admin}
      MONGO_DB: ${MONGO_DB:-DTP}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      GENERATED_APPLICATIONS_DIR: /app/generated-applications
      SEED_DIR: /app/seed
      SECRETS_DIR: /app/secrets
      LOCATION_CONFIG: /app/config/location.json
      ROLE_FILTER_CONFIG: /app/config/roleFilter.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GMAIL_QUERY: ${GMAIL_QUERY:-label:JobAlerts newer_than:2d}
      GMAIL_PROCESSED_LABEL: ${GMAIL_PROCESSED_LABEL:-false}
      INGEST_MAX_LISTINGS: ${INGEST_MAX_LISTINGS:-500}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REPOSITORY_CACHE_DIR: /app/repository-cache
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./generated-applications:/app/generated-applications
      - ./seed:/app/seed:ro
      - ./secrets:/app/secrets:ro
      - ./config:/app/config:ro
      - ./repository-cache:/app/repository-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://cvadmin:change-me-local@mongodb:27017/DTP?authSource=admin}
      MONGO_DB: ${MONGO_DB:-DTP}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      GENERATED_APPLICATIONS_DIR: /app/generated-applications
      SEED_DIR: /app/seed
      SECRETS_DIR: /app/secrets
      LOCATION_CONFIG: /app/config/location.json
      ROLE_FILTER_CONFIG: /app/config/roleFilter.json
      AUTO_SEED: "true"
      INGEST_ON_START: ${INGEST_ON_START:-true}
      GITHUB_SCAN_ON_START: ${GITHUB_SCAN_ON_START:-false}
      GMAIL_QUERY: ${GMAIL_QUERY:-label:JobAlerts newer_than:2d}
      GMAIL_PROCESSED_LABEL: ${GMAIL_PROCESSED_LABEL:-false}
      INGEST_MAX_LISTINGS: ${INGEST_MAX_LISTINGS:-500}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REPOSITORY_CACHE_DIR: /app/repository-cache
    volumes:
      - ./generated-applications:/app/generated-applications
      - ./seed:/app/seed:ro
      - ./secrets:/app/secrets
      - ./config:/app/config:ro
      - ./repository-cache:/app/repository-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      API_BASE_INTERNAL: ${API_BASE_INTERNAL:-http://api:8000}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongodb_data:
